alias: AssistDomo - Pergola et volets selon temperature
description: Compare la température du BMP280 à la consigne et envoie l'ordre à l'ESP32
triggers:
- trigger: numeric_state
  entity_id: sensor.gougougagah_temperature
  above: input_number.temperature_souhaitee
- trigger: numeric_state
  entity_id: sensor.gougougagah_temperature
  below: input_number.temperature_souhaitee
- trigger: state
  entity_id: input_number.temperature_souhaitee
variables:
  t: '{{ states(''sensor.gougougagah_temperature'') | float(0) }}'
  consigne: '{{ states(''input_number.temperature_souhaitee'') | float(20) }}'
  saison: "{% set m = now().month %} {{ 'ete' if m in [6,7,8] else 'hiver' if m in [12,1,2]\n   else 'printemps' if m in [3,4,5] else 'automne' }}"
actions:
- choose:
  - conditions: '{{ t > consigne }}'
    sequence:
    - action: mqtt.publish
      data:
        topic: gougougagah/ordre
        payload: "{{ 'PERGOLA : lames fermees + VOLETS baisses'\n   if saison == 'ete' else 'PERGOLA : lames fermees' }}\n({{ saison }}, T={{ t }} > {{ consigne }})"
  default:
  - action: mqtt.publish
    data:
      topic: gougougagah/ordre
      payload: "{{ 'PERGOLA : lames ouvertes + VOLETS ouverts'\n   if saison in ['hiver','automne'] else 'PERGOLA : lames ouvertes' }}\n({{ saison }}, T={{ t }} <= {{ consigne }})"
mode: restart
